<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>İstanbul'un Fethi AR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        /* Butonun her zaman görünür ve ekranın ortasında olması için */
        #start-button {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10000; /* En üstte durması için */
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <button id="start-button">DENEYİMİ BAŞLAT ⚔️</button>

    <a-scene mindar-image="imageTargetSrc: resim_video/targets.mind;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">

        <a-assets>
            <video id="my-video" 
                   src="resim_video/istanbul_video.mp4" 
                   preload="auto" 
                   loop="true" 
                   crossorigin="anonymous" 
                   playsinline 
                   webkit-playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-video src="#my-video" width="1" height="0.55" position="0 0 0"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const videoEl = document.querySelector('#my-video');
        const startBtn = document.querySelector('#start-button');
        
        // Butona tıklandığında hem videoyu hazırla hem de butonu kaldır
        startBtn.addEventListener('click', () => {
            videoEl.play(); // Videoyu başlat
            videoEl.pause(); // Hemen duraklat (tarayıcı izni alındı)
            videoEl.currentTime = 0;
