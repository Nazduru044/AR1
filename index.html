<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>İstanbul'un Fethi AR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        #start-button {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; background: #e74c3c; color: white;
            border: none; border-radius: 50px; font-size: 18px; font-weight: bold;
            z-index: 10000; cursor: pointer;
        }
    </style>
</head>
<body>

    <button id="start-button">DENEYİMİ BAŞLAT ⚔️</button>

    <a-scene mindar-image="imageTargetSrc: resim_video/targets.mind; uiLoading: yes;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">

        <a-assets>
            <video id="my-video" 
                   src="resim_video/Video 1.mp4" 
                   preload="auto" 
                   loop="true" 
                   crossorigin="anonymous" 
                   playsinline 
                   webkit-playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-video src="#my-video" width="1" height="0.55" position="0 0 0"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const videoEl = document.querySelector('#my-video');
        const startBtn = document.querySelector('#start-button');
        
        startBtn.addEventListener('click', () => {
            // Tarayıcıya video oynatma izni veriyoruz
            videoEl.play().then(() => {
                videoEl.pause();
                videoEl.muted = false;
                startBtn.style.display = "none";
            }).catch(err => {
                console.error("Video başlatılamadı:", err);
            });
        });

        // Hata kontrolü: mind dosyası yüklenemezse konsola yazdır
        document.querySelector('a-scene').addEventListener("arError", (event) => {
          alert("AR Başlatılamadı! Lütfen kamera iznini ve targets.mind dosyasını kontrol edin.");
        });
    </script>
</body>
</html>
